name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        base: ['/', '/wiki/']
    env:
      NUXT_APP_BASE_URL: ${{ matrix.base }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Install browsers
        run: pnpm exec playwright install --with-deps chromium firefox
      - name: Add synthetic private canary
        run: |
          cp tests/fixtures/private-note.md apps/wiki/content/private/private-fixture.md
          cp tests/fixtures/private-credit.md apps/wiki/content/private/private-credit-fixture.md
      - name: Add synthetic multi-contributor sources
        run: cp tests/fixtures/contributors/*.md apps/wiki/content/public/
      - run: pnpm verify
      - run: pnpm test:compat
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-report-${{ strategy.job-index }}
          path: |
            playwright-report/
            test-results/
          retention-days: 7
  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pages: write
      id-token: write
    concurrency:
      group: github-pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    env:
      WIKI_AUDIENCE: public
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - uses: actions/configure-pages@v5
        id: pages
      - run: pnpm install --frozen-lockfile
      - name: Build clean public edition for the Pages URL
        run: pnpm verify
        env:
          NUXT_APP_BASE_URL: ${{ steps.pages.outputs.base_path }}/
      - uses: actions/upload-pages-artifact@v4
        with:
          path: apps/wiki/.output/public
      - uses: actions/deploy-pages@v4
        id: deployment
