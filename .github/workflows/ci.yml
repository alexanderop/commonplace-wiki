name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        base: ['/', '/wiki/']
    env:
      NUXT_APP_BASE_URL: ${{ matrix.base }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Install browsers
        run: pnpm exec playwright install --with-deps chromium firefox
      - name: Add synthetic private canary
        run: cp tests/fixtures/private-note.md apps/wiki/content/private/private-fixture.md
      - run: pnpm verify
      - run: pnpm test:compat
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-report-${{ strategy.job-index }}
          path: |
            playwright-report/
            test-results/
          retention-days: 7
